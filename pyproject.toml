[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arxiv-mcp"
version = "0.1.0"
description = "An MCP server that exposes arXiv search, paper metadata, PDF text extraction and category trends as tools for LLM agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Xuening Pi" }]
keywords = ["mcp", "arxiv", "llm", "agent", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
arxiv-mcp = "arxiv_mcp:main"

[project.urls]
Homepage = "https://github.com/dear-pi/arxiv-mcp"
Documentation = "https://github.com/dear-pi/arxiv-mcp#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
